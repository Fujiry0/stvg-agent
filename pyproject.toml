[project]
name = "stvg-agent"
version = "0.1.0"
description = "Code-as-action agent for spatio-temporal video grounding (AnyGroundBench)"
requires-python = ">=3.12"
dependencies = [
    "av>=12.0",
    "decord>=0.6.0",
    "opencv-python-headless>=4.8",
    "ipykernel>=6.29",
    "jupyter_client>=8.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "psutil>=5.9",
    "openai>=1.60",
    "pillow>=10.0",
    "requests>=2.31",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stvg_agent*"]
